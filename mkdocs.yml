theme:
  name: material
  logo: assets/phoenix_cl2.png
  font:
    text: Inter
  palette:
    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
      primary: blue grey
      accent: amber

    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
      primary: indigo
      accent: blue
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - content.tabs.link
    - content.code.copy
    - navigation.sections
    - navigation.expand

markdown_extensions:
  - pymdownx.emoji:
      emoji_index:     !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.blocks.admonition
  - pymdownx.blocks.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables

plugins:
  - mkquartodocs
  - search:
      lang: en
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: "🌚 English"
          build: true
        - locale: zh
          name: "🇨🇳 简体中文"
          build: true
          # build: false
        - locale: ko
          name: "🇰🇷 한국어"
          build: false
        - locale: ja
          name: "🇯🇵 日本語"
          build: false
        - locale: es
          name: "🇪🇸 Español"
          build: false
        - locale: pt-BR
          name: "🇧🇷 Português (BR)"
          build: false

hooks:
  - hooks.py

extra:
  analytics:
    provider: google
    property: G-G5JZNSNPH6

extra_css:
  - stylesheets/extra.css